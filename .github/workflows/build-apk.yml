name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Create eas.json
      run: |
        cat > eas.json << 'EAS'
        {
          "cli": {
            "version": ">= 5.0.0"
          },
          "build": {
            "development": {
              "developmentClient": true,
              "distribution": "internal"
            },
            "preview": {
              "android": {
                "buildType": "apk"
              }
            },
            "production": {}
          }
        }
        EAS
    
    - name: Expo prebuild (generate native Android project)
      run: npx expo prebuild --platform android --no-install --clean
    
    - name: Generate debug keystore for release signing
      run: |
        keytool -genkeypair \
          -v \
          -storetype PKCS12 \
          -keystore android/app/debug.keystore \
          -alias androiddebugkey \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
    
    - name: Configure Gradle for release build with debug keystore
      run: |
        cat >> android/app/build.gradle << 'GRADLE'
        android {
            signingConfigs {
                release {
                    storeFile file('debug.keystore')
                    storePassword 'android'
                    keyAlias 'androiddebugkey'
                    keyPassword 'android'
                }
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.release
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }
        GRADLE
    
    - name: Build Release APK
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: anime-notes-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30
