name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Fix Expo dependency versions
      run: npx expo install --fix --check
    
    - name: Create eas.json
      run: |
        cat > eas.json << 'EAS'
        {
          "cli": {
            "version": ">= 5.0.0"
          },
          "build": {
            "development": {
              "developmentClient": true,
              "distribution": "internal"
            },
            "preview": {
              "android": {
                "buildType": "apk"
              }
            },
            "production": {}
          }
        }
        EAS
    
    - name: Expo prebuild (generate native Android project)
      run: npx expo prebuild --platform android --no-install --clean
    
    - name: Build Debug APK
      working-directory: android
      run: ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: anime-notes-apk
        path: android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
