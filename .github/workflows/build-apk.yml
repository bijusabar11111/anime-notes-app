name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install dependencies
      run: npm install --legacy-peer-deps
    
    - name: Create eas.json
      run: |
        cat > eas.json << 'EAS'
        {
          "cli": {
            "version": ">= 5.0.0"
          },
          "build": {
            "development": {
              "developmentClient": true,
              "distribution": "internal"
            },
            "preview": {
              "android": {
                "buildType": "apk"
              }
            },
            "production": {}
          }
        }
        EAS
    
    - name: Expo prebuild (generate native Android project)
      run: npx expo prebuild --platform android --no-install --clean
    
    - name: Generate keystore for release signing
      run: keytool -genkeypair -v -storetype PKCS12 -keystore android/app/release.keystore -alias release-key -keyalg RSA -keysize 2048 -validity 10000 -storepass anime123 -keypass anime123 -dname "CN=Anime Notes, O=AnimeNotes, C=IN"
    
    - name: Create signing config for release
      run: |
        sed -i "s|signingConfig signingConfigs.debug|signingConfig signingConfigs.release|g" android/app/build.gradle
        cat >> android/app/build.gradle << 'GRADLE'
        
        android {
            signingConfigs {
                release {
                    storeFile file('release.keystore')
                    storePassword 'anime123'
                    keyAlias 'release-key'
                    keyPassword 'anime123'
                }
            }
        }
        GRADLE
    
    - name: Build Release APK
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: anime-notes-apk
        path: android/app/build/outputs/apk/release/*.apk
        retention-days: 30
